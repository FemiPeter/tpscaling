[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tpscaling"
version = "1.0.0"
description = "Extreme precipitation-temperature scaling over the Tibetan Plateau"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Jesufemi Olowe"}]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scipy>=1.7",
    "statsmodels>=0.13",
    "scikit-learn>=1.0",
]

[project.optional-dependencies]
era5 = ["xarray>=2022.3", "netcdf4>=1.5", "cdsapi>=0.6"]
maps = ["matplotlib>=3.5", "cartopy>=0.21", "geopandas>=0.12"]

[project.scripts]
tpscaling = "tpscaling.cli:main"

[tool.setuptools]
packages = ["tpscaling"]
